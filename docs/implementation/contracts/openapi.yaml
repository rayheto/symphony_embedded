components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _symphony_elixir_key
      description: Reuse actual configured Phoenix session cookie; this name must
        match endpoint configuration at M0. Loopback may use server-established local
        actor.
  schemas:
    Binding:
      type: object
      properties:
        repo_revision:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{40}$
          - type: 'null'
        worktree_patch_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        build_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        firmware_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        device_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        hardware_revision:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        boot_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        config_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        test_profile:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        criteria_revision:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - repo_revision
      - worktree_patch_sha256
      - build_id
      - firmware_sha256
      - device_id
      - hardware_revision
      - boot_id
      - config_sha256
      - test_profile
      - criteria_revision
      additionalProperties: false
    Actor:
      type: object
      properties:
        kind:
          type: string
          enum:
          - human
          - agent
          - system
        id:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
      required:
      - kind
      - id
      - display_name
      additionalProperties: false
    EngineeringState:
      type: object
      properties:
        implementation_status:
          type: string
          enum:
          - planned
          - building
          - integrated
        verification_status:
          type: string
          enum:
          - unverified
          - passed
          - failed
          - stale
        human_review_status:
          type: string
          enum:
          - unseen
          - reviewed
          - accepted
          - changes_requested
        agent_endorsed:
          type: boolean
      required:
      - implementation_status
      - verification_status
      - human_review_status
      - agent_endorsed
      additionalProperties: false
