openapi: 3.1.0
info:
  title: Symphony Engineering Experience API
  version: 1.0.0
  description: Implementation contract; endpoints are proposed, not yet shipped. Original
    /api/v1 remains unchanged.
servers:
- url: /experience/v1
security:
- sessionCookie: []
paths:
  /snapshot:
    get:
      operationId: get_snapshot
      summary: Snapshot
      parameters:
      - &id001
        name: project_id
        in: query
        required: true
        schema: &id012
          type: string
          minLength: 1
      - name: refresh
        in: query
        schema: &id015
          type: boolean
        description: Request fresh read/probe under rate limit, never perform control
          writes
      responses:
        '200':
          description: Confirmed read result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '400': &id003
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id004
          description: Identity required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id005
          description: Forbidden / CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id006
          description: Not found in project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id007
          description: Revision, idempotency, cursor or ownership conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413': &id008
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id009
          description: Semantically invalid / capability unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id010
          description: Backpressure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id011
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
