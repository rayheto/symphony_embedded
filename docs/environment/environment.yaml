archify_notes:
  - deliver 退出 0（9/9 artifact checks，0 error/0 warning，来源核验 verified）
  - visual-check 退出 0，产出 1440x900 与 2048x1320 的明暗两套截图与 contact sheet。
  - 此前记录的「Chrome 无法完成 http/https 导航」并不成立，原因已定位并修复：headless Chrome 启动后
    会向会话 keyring（gnome-keyring，经 D-Bus）索要 cookie 加密密钥；本环境 XDG_SESSION_TYPE=tty，
    该调用不返回，CookieStore 的持久层因此永远加载不完（NetLog 只有
    COOKIE_PERSISTENT_STORE_KEY_LOAD_STARTED，从无 ..._LOAD_FINISHED），而 URLRequestHttpJob 在
    cookie 这一步同步等待，于是所有带 cookie 的请求（即所有导航）都永远停在拿到 socket 之前。
    加 --password-store=basic 即恢复；workbench-shots.sh 与 archify bin/visual-check.mjs 均已带上该 flag。
  - 排查中被误读的现象：Chrome 确实与目标建立了 TCP 连接但那两个 socket 是 is_preconnect=true 的预连接，
    在 +510ms 被 SOCKET_POOL_CLOSING_SOCKET 以 reason="Cert verifier changed" 清池；主框架请求从未绑定到
    socket，所以「连接建立后字节没发出」不是故障本身。代理、磁盘缓存、--no-sandbox 均与本次无关。
  - 环境修好后第一次采集就发现真实缺陷：1440x900 上 scrollHeight=937（溢出 37px）、1600x1000
    差 19px；按上游顺序压缩 IR 排版（行距收紧、边界 pad 24→18，不动节点尺寸与字号）后重出图，
    四个视口全部装得下，deliver 9/9、visual-check 退出 0。产物与 manifest 均为修复后这一版。
  - 产物：docs/architecture/symphony-embedded-workbench/
