archify_notes:
  - deliver 退出 0（9/9 artifact checks，0 error/0 warning，来源核验 verified）
  - visual-check 退出 1，且已定位原因：Chrome 会与目标建立 TCP 连接，但在发出任何请求字节前就
    关闭它（自建裸 socket 服务器观测到两次 ACCEPT 后 recv 返回 0 字节）。file:// 与 data: 导航
    0.25s 完成，所以渲染与 dump-dom 路径本身没问题；同一次运行里 Chrome 的组件更新器成功传输过
    HTTPS 数据（161KB/2.4s、248KB/0.36s）。
  - 已排除代理：环境里确实有三层代理配置（http_proxy/https_proxy/no_proxy、gsettings manual
    127.0.0.1:7897、PAC http://127.0.0.1:33331/commands/pac 返回 PROXY 127.0.0.1:7897），但
    --no-proxy-server、显式 --proxy-server、以及清空全部 proxy 环境变量并换用全新 user-data-dir
    三种情况下表现完全相同；curl 直连、走 HTTP 代理、走 SOCKS5 均返回 200。
  - 同样无效：--headless=shell、--single-process（报 V8 Proxy resolver 不可用）、
    NetworkServiceInProcess、关闭后台网络与组件更新的整套 flag。chrome.status=available，
    因此状态记为 failed 而非 skipped。
  - 产物：docs/architecture/symphony-embedded-workbench/
